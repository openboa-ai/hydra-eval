name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluation-structure:
    name: evaluation-structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check foundation layout
        run: |
          test -f README.md
          test -f EVALUATION.md
          test -f tasks/README.md
          test -f results/README.md
          test ! -e evals.json
          test ! -e grader.py
          test ! -e runner.py
          test ! -e jobs
          git diff --check
      - name: Check public evidence hygiene
        run: |
          ! find . -type f -not -path './.git/*' -not -path './.github/*' -size +2M -print -quit | grep -q .
          ! rg -n 'sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}' --glob '!*.md' .
